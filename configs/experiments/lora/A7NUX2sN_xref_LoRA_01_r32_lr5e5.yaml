# A7NUX2sN_xref_LoRA_01_r32_lr5e5 — A7NUX2s + 무감정 정답 5,941행(542 자리를 A7N · A7NU 무감정으로 채움) (2026-11-07 21:36 사용자 결정 · 지시문 q3tts 세션 21:45)
#   왜: A7NUX2s(542 0)에서 542 화자 A칸 감정이 돌아왔지만 무감정 비율도 10.7 → 8.05% 로 함께 줄어 원인을 못 가름
#       → 542 0 이면서 무감정 비율을 A7NUX2Rs6 과 같게(10.69%) 맞춤 · (가) 542 지름길 vs (나) 무감정 비율
#   데이터: A7NUX2sN(tools/make_a7nux2rs6.py --n542 0 --neu_fill) · 206,570행 = A7NUX2s 200,629 + 무감정 정답 5,941(A7N 5,506 · A7NU 435 · 화자 53)
#           추가 행의 ref 는 규칙상 다른 칸 = 모두 감정 녹음(A 3,405 · B 2,536) — 542 행(무감정 ref → 무감정 정답)과 이 점도 다름
#   설정: A7NUX2s_xref_LoRA_01_r32_lr5e5 복제 — 데이터 경로(train · val_xref) · run_name · 이 주석만 다름
#   짝: A7NUX2Rs6(행 수 · 무감정 비율 같음 · 무감정 5,941행이 542 화자인가만 다름) · A7NUX2s(무감정 5,941행 있음/없음)
#   실행(byobu): ./scripts/run.sh train lora --exp configs/experiments/lora/A7NUX2sN_xref_LoRA_01_r32_lr5e5.yaml --hw rtxpro6000_2gpu --accel 2gpu_b
logging:
  run_name: A7NUX2sN_xref_LoRA_01_r32_lr5e5
data:
  train_jsonl: A7NUX2sN/train.jsonl
  val_jsonl: A7N/val.jsonl
  val_unseen_jsonl: A7N/val_unseen8/val.jsonl
  val_unseen_pool_jsonl: A7N/val_unseen8/ref_pool.jsonl
  val_xref_jsonl: A7NUX2sN/val_xref.jsonl   # 감정 ref 판 val(192) → TB val_xref/*
  ref:
