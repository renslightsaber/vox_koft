# A7NUX2sN_xref_LoRA_02_r32_lr5e5_iv3 — A7NUX2sN 과 같은 데이터 · 같은 설정, **감정 지시문 표만 v3**(분노B 문구만 다름) (2026-11-08 23:25 지시문 q3tts 세션 · 사용자 승인)
#   왜: 11/08 시험 A — 추론 문구를 분노A 문구로 바꾸면 분노B 가 −2.8반음 · 목소리 0.567 → 0.633. 학습 문구 "shouting · loud" 를 빼면
#       분노B 소리침이 줄어드는지 본다.
#   v3 분노B: "Strong anger, intense and forceful, firm voice without shouting" (v1: "Furious and shouting, strong anger, loud and harsh")
#   설정: A7NUX2sN_xref_LoRA_01_r32_lr5e5 복제 — data.emotion.map_file · run_name · 이 주석만 다름(데이터 · lr 5e-5 · r32 · 4,500 step 그대로)
#   평가: D 재측정을 v3 문구(tag NUX2sNiv3lr5e5_s*)와 v1 문구(tag NUX2sNiv3v1_s* · 참고)로 두 번
#   실행: ./scripts/run.sh train lora --exp configs/experiments/lora/A7NUX2sN_xref_LoRA_02_r32_lr5e5_iv3.yaml --hw rtxpro6000_2gpu --accel 2gpu_b
logging:
  run_name: A7NUX2sN_xref_LoRA_02_r32_lr5e5_iv3
data:
  train_jsonl: A7NUX2sN/train.jsonl
  val_jsonl: A7N/val.jsonl
  val_unseen_jsonl: A7N/val_unseen8/val.jsonl
  val_unseen_pool_jsonl: A7N/val_unseen8/ref_pool.jsonl
  val_xref_jsonl: A7NUX2sN/val_xref.jsonl   # 감정 ref 판 val(192) → TB val_xref/*
  emotion:
    map_file: configs/emotion/a7n_vox_v3.yaml   # ← v3(분노B 만 v1 과 다름)
  ref:
    pool_jsonl: A7N/ref_pool.jsonl
  batch_size: 8                     # hw yaml(8) 대신 — 방식마다 메모리가 달라 실험에 둠
optim:
  lr: 5.0e-5
  warmup_steps: 200
train:
  max_steps: 4500
  grad_accum: 2
  eval_every: 500
  save_every: 500
  keep_last: 9
  resume: {enable: true, every: 500, keep: 1}
media:
  every: 500
lora:
  enable: true
  r: 32
  alpha: 32
