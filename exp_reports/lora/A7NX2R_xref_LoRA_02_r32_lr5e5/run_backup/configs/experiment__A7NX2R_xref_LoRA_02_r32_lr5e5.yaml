# A7NX2R_xref_LoRA_02_r32_lr5e5 — "다른 칸 ref" LoRA(r32) · A7NX3 수정안 A7NX2R (2026-11-07 사용자 결정 · 지시문 q3tts 세션 00:35)
#   왜: A7NX3(ref 3개 · 9,000 step)는 val_unseen 이 s750 바닥 뒤 오름 → 같은 정답을 여러 번 보며 학습 화자에 맞춰지는 신호
#   데이터: A7NX2R(tools/make_a7nx2r.py) · 229,820행 = A7N 206,310(정답 103,155 × 다른 칸 ref 2) + 542 무감정 23,510(992명 × 정답 약 12 × 같은 화자 다른 문장 ref 2 · Neutrality 지시문)
#           음질 나쁜 정답 · ref 제외 · 무감정 비율 23.2% · 542 비중 10.2% · 행마다 고정 ref_audio(dataset 이 항상 그 ref)
#   설정: A7NX3_xref_LoRA_01_r32 복제 · 4,500 step(약 14.4만 행 ≈ 정답당 1.2번) · eval/save 500 · keep_last 9 · lr 5.0e-5
#   짝: A7NX2R_xref_LoRA_01_r32(lr 만 다름) · 비교: A7N_ref_LoRA_01_r32 · A7NX · A7NX3
#   실행(byobu): ./scripts/run.sh train lora --exp configs/experiments/lora/A7NX2R_xref_LoRA_02_r32_lr5e5.yaml --hw rtxpro6000_2gpu --accel 2gpu_b
logging:
  run_name: A7NX2R_xref_LoRA_02_r32_lr5e5
data:
  train_jsonl: A7NX2R/train.jsonl
  val_jsonl: A7N/val.jsonl
  val_unseen_jsonl: A7N/val_unseen8/val.jsonl
  val_unseen_pool_jsonl: A7N/val_unseen8/ref_pool.jsonl
  val_xref_jsonl: A7NX2R/val_xref.jsonl   # 감정 ref 판 val(192) → TB val_xref/*
  ref:
    pool_jsonl: A7N/ref_pool.jsonl
  batch_size: 8                     # hw yaml(8) 대신 — 방식마다 메모리가 달라 실험에 둠
optim:
  lr: 5.0e-5
  warmup_steps: 200
train:
  max_steps: 4500
  grad_accum: 2
  eval_every: 500
  save_every: 500
  keep_last: 9
  resume: {enable: true, every: 500, keep: 1}
media:
  every: 500
lora:
  enable: true
  r: 32
  alpha: 32
