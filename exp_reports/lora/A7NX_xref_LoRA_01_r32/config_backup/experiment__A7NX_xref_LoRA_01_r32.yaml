# A7NX_xref_LoRA_01_r32 — "다른 칸 ref" LoRA(r32) (2026-11-06 사용자 결정 · 지시문 q3tts 세션 16:40)
#   목적: 같은 사람의 **다른 칸** 녹음을 ref 로, 지시문은 정답 칸 것 → "목소리는 ref, 감정은 지시문"(떼어 놓기)
#   데이터: A7NX(tools/make_a7nx.py · 행마다 고정 ref_audio — dataset 이 ref_ratio · 풀을 무시하고 항상 그 ref 를 씀)
#           정답마다 ref 1개 고정 · 104,664행 · 화자 96 · ref 종류 N 36.6% · A 37.7% · B 25.7%
#   짝(비교 기준): A7N_ref_LoRA_01_r32(같은 lr · r · 배치) · val 은 그것과 같은 A7N val + 무감정 풀 · 추가 val_xref(감정 ref)
#   노출: 3,000 step = LoRA_01 과 같음
#   실행(사용자 · byobu): ./scripts/run.sh train lora --exp configs/experiments/lora/A7NX_xref_LoRA_01_r32.yaml --hw rtxpro6000_2gpu --accel 2gpu_b
logging:
  run_name: A7NX_xref_LoRA_01_r32
data:
  train_jsonl: A7NX/train.jsonl
  val_jsonl: A7N/val.jsonl
  val_unseen_jsonl: A7N/val_unseen8/val.jsonl
  val_unseen_pool_jsonl: A7N/val_unseen8/ref_pool.jsonl
  val_xref_jsonl: A7NX/val_xref.jsonl   # 감정 ref 판 val(192) → TB val_xref/*
  ref:
    pool_jsonl: A7N/ref_pool.jsonl
  batch_size: 8                     # hw yaml(8) 대신 — 방식마다 메모리가 달라 실험에 둠
optim:
  lr: 1.0e-4
  warmup_steps: 200
train:
  max_steps: 3000
  grad_accum: 2
  eval_every: 250
  save_every: 250
  keep_last: 12
  resume: {enable: true, every: 500, keep: 1}
media:
  every: 500
lora:
  enable: true
  r: 32
  alpha: 32
