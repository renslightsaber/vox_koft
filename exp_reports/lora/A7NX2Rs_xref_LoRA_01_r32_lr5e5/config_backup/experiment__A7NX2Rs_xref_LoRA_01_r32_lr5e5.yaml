# A7NX2Rs_xref_LoRA_01_r32_lr5e5 — "다른 칸 ref" LoRA(r32) · A7NX2R 수정안 A7NX2Rs (2026-11-07 10~11시 사용자 결정 · 지시문 q3tts 세션 11:45)
#   왜: A7NX2R 두 판은 목소리 최고 · 감정 약해짐 → 무감정 비율 23.2% 탓으로 추정(감정 연습 약 10% ↓)
#   데이터: A7NX2Rs(tools/make_a7nx2rs.py) · 203,110행 = A7N 191,355(감정 정답 88,200 × ref 2 + 무감정 정답 14,955 × ref 1) + 542 11,755(992명 × 약 12 × ref 1)
#           무감정 비율 13.2% · 542 비중 5.8% · 감정 행 176,400개는 A7NX2R 과 똑같음 · 무감정 행은 A7NX2R 의 부분집합
#   설정: A7NX2R_xref_LoRA_02_r32_lr5e5 복제 — 데이터 경로(train · val_xref)와 이 주석만 다름 · 4,500 step ≈ 0.71 epoch
#   비교: A7NX2R 두 판 · A7NX3_xref_LoRA_01_r32 · A7N_ref_LoRA_01_r32
#   실행(byobu): ./scripts/run.sh train lora --exp configs/experiments/lora/A7NX2Rs_xref_LoRA_01_r32_lr5e5.yaml --hw rtxpro6000_2gpu --accel 2gpu_b
logging:
  run_name: A7NX2Rs_xref_LoRA_01_r32_lr5e5
data:
  train_jsonl: A7NX2Rs/train.jsonl
  val_jsonl: A7N/val.jsonl
  val_unseen_jsonl: A7N/val_unseen8/val.jsonl
  val_unseen_pool_jsonl: A7N/val_unseen8/ref_pool.jsonl
  val_xref_jsonl: A7NX2Rs/val_xref.jsonl   # 감정 ref 판 val(192) → TB val_xref/*
  ref:
    pool_jsonl: A7N/ref_pool.jsonl
  batch_size: 8                     # hw yaml(8) 대신 — 방식마다 메모리가 달라 실험에 둠
optim:
  lr: 5.0e-5
  warmup_steps: 200
train:
  max_steps: 4500
  grad_accum: 2
  eval_every: 500
  save_every: 500
  keep_last: 9
  resume: {enable: true, every: 500, keep: 1}
media:
  every: 500
lora:
  enable: true
  r: 32
  alpha: 32
